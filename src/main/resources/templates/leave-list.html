<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Leave Requests</title>
</head>
<body>

<h2>Leave Requests</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Employee</th>
        <th>Start</th>
        <th>End</th>
        <th>Reason</th>
        <th>Status</th>

        <!-- Show Action column only if role is MANAGER or ADMIN -->
        <th th:if="${role == 'MANAGER' or role == 'ADMIN'}">
            Action
        </th>
    </tr>

    <tr th:each="leave : ${leaves}">
        <td th:text="${leave.leaveId}"></td>
        <td th:text="${leave.employee.name}"></td>
        <td th:text="${leave.startDate}"></td>
        <td th:text="${leave.endDate}"></td>
        <td th:text="${leave.reason}"></td>
        <td th:text="${leave.status}"></td>

        <!-- Action buttons -->
        <td th:if="${role == 'MANAGER' or role == 'ADMIN'}">

            <a th:if="${leave.status == 'PENDING'}"
               th:href="@{/leaves/approve/{id}(id=${leave.leaveId})}">
                Approve
            </a>

            <span th:if="${leave.status == 'PENDING'}"> | </span>

            <a th:if="${leave.status == 'PENDING'}"
               th:href="@{/leaves/reject/{id}(id=${leave.leaveId})}">
                Reject
            </a>

        </td>
    </tr>

</table>

</body>
</html>
