<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a href="/" class="navbar-brand">RevWorkForce HRM</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow p-4">
        <h3 class="mb-4">Add Employee</h3>

        <form th:action="@{/employees/save}"
              th:object="${employee}"
              method="post">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}"
                       class="form-control" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}"
                       class="form-control" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" th:field="*{password}"
                       class="form-control" required>
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}"
                       class="form-control">
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select th:field="*{role}" class="form-select" required>
                    <option value="">Select Role</option>
                    <option value="EMPLOYEE">EMPLOYEE</option>
                    <option value="MANAGER">MANAGER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="INACTIVE">INACTIVE</option>
                </select>
            </div>

            <!-- Department -->
            <div class="mb-3">
                <label class="form-label">Department</label>
                <select th:field="*{department.departmentId}"
                        class="form-select">
                    <option value="">Select Department</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.departmentId}"
                            th:text="${dept.name}">
                    </option>
                </select>
            </div>

            <!-- Reporting Manager -->
            <div class="mb-3">
                <label class="form-label">Reporting Manager</label>
                <select th:field="*{reportingManager.employeeId}"
                        class="form-select">
                    <option value="">Select Manager</option>
                    <option th:each="mgr : ${managers}"
                            th:value="${mgr.employeeId}"
                            th:text="${mgr.name}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Save Employee
            </button>

            <a href="/employees/list" class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>

</div>

</body>
</html>
