<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Employee Management')}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-container">
        <div class="page-header">
            <h1 th:text="${employee.empId != null ? 'Edit Employee' : 'Add New Employee'}">Add Employee</h1>
            <a href="/admin/employees" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to List
            </a>
        </div>

        <form th:action="@{/admin/employees/save}" th:object="${employee}" method="post" class="card">
            <div th:if="${error}" class="alert alert-error"
                style="background-color: #fef2f2; border: 1px solid #dbeafe; color: #1e40af; padding: 1rem; border-radius: 0.5rem; margin-bottom: 2rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.75rem;">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Error message</span>
            </div>

            <div class="form-section" style="margin-bottom: 2rem;">
                <h3
                    style="margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; color: #1e40af;">
                    Personal Information</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" th:field="*{firstName}" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" th:field="*{lastName}" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" th:field="*{email}" required>
                    </div>
                    <div class="form-group">
                        <label
                            th:text="${employee.empId != null ? 'Password (Leave empty to keep current password)' : 'Password (Leave empty for default Welcome@123)'}">Password</label>
                        <div style="position: relative;">
                            <input type="password" th:field="*{password}" id="password">
                            <i class="fas fa-eye toggle-password" id="togglePassword"
                                style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; cursor: pointer;"></i>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" th:field="*{phone}" required>
                </div>
                <div class="form-group">
                    <label>Residential Address</label>
                    <textarea th:field="*{address}" rows="2" required></textarea>
                </div>
            </div>

            <div class="form-section" style="margin-top: 2rem; margin-bottom: 2rem;">
                <h3
                    style="margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; color: #1e40af;">
                    Employment Details</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text" th:field="*{empId}" required>
                    </div>
                    <div class="form-group">
                        <label>Designation</label>
                        <select th:field="*{designationId}" required>
                            <option value="">Select Designation</option>
                            <option th:each="desg : ${designations}" th:value="${desg.designationId}"
                                th:text="${desg.designationName}">Developer</option>
                        </select>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Department</label>
                        <select th:field="*{departmentId}" required>
                            <option value="">Select Department</option>
                            <option th:each="dept : ${departments}" th:value="${dept.departmentId}"
                                th:text="${dept.departmentName}">Engineering</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Joining Date</label>
                        <input type="date" th:field="*{joiningDate}" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Reporting Manager</label>
                        <select th:field="*{managerId}">
                            <option value="">No Manager / Self</option>
                            <option th:each="mgr : ${managers}" th:if="${mgr.empId != employee.empId}"
                                th:value="${mgr.empId}"
                                th:text="${mgr.firstName + ' ' + mgr.lastName + ' (' + mgr.empId + ')'}">Manager Name
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary</label>
                        <input type="number" th:field="*{salary}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select th:field="*{role}" required>
                        <option value="ROLE_EMPLOYEE">Employee</option>
                        <option value="ROLE_MANAGER">Manager</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button type="reset" class="btn btn-secondary">Reset Form</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Employee
                    <script>
                        const togglePassword = document.querySelector('#togglePassword');
                        const passwordInput = document.querySelector('#password');

                        if (togglePassword && passwordInput) {
                            togglePassword.addEventListener('click', function (e) {
                                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                                passwordInput.setAttribute('type', type);
                                // Reversed logic: open eye (fa-eye) to HIDE, eye-slash to SHOW
                                if (type === 'password') {
                                    this.classList.remove('fa-eye-slash');
                                    this.classList.add('fa-eye');
                                } else {
                                    this.classList.remove('fa-eye');
                                    this.classList.add('fa-eye-slash');
                                }
                            });
                        }
                    </script>
</body>

</html>
