<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Adjust Balances')}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-container">
        <header>
            <h1>Leave Balances</h1>
        </header>

        <div class="grid-layout">
            <div class="card">
                <h2 class="card-title"><i class="fas fa-wallet"></i> Current Balances</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Leave Type</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="bal : ${balances}">
                            <td>
                                <div style="font-weight: 600;"
                                    th:text="${bal.employee.firstName + ' ' + bal.employee.lastName}">John Doe</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);"
                                    th:text="${bal.employee.empId}">EMP001</div>
                            </td>
                            <td th:text="${bal.leaveType.leaveName}">Casual Leave</td>
                            <td style="font-weight: 700; color: var(--primary);" th:text="${bal.balanceDays + ' Days'}">
                                10 Days</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card" style="height: fit-content;">
                <h2 class="card-title"><i class="fas fa-edit"></i> Adjust Balance</h2>
                <form th:action="@{/admin/leaves/balances/adjust}" method="post">
                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text" name="empId" placeholder="e.g. EMP001" required>
                    </div>
                    <div class="form-group">
                        <label>Leave Type</label>
                        <select name="leaveTypeId" required>
                            <option th:each="type : ${leaveTypes}" th:value="${type.leaveTypeId}"
                                th:text="${type.leaveName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Adjustment (+/- Days)</label>
                        <input type="number" name="adjustment" placeholder="e.g. 5 or -2" required>
                        <small style="color: var(--text-muted); font-size: 0.7rem;">Enter positive to add, negative to
                            subtract.</small>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-sync"></i> Apply Adjustment</button>
                </form>
            </div>
        </div>
        </div>
</body>

</html>
