<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Configure Leave Types')}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-container">
        <header>
            <h1>Leave Configuration</h1>
        </header>

        <div class="grid-layout">
            <div class="card">
                <h2 class="card-title"><i class="fas fa-list"></i> Existing Leave Types</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Leave Name</th>
                            <th>Max Days/Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="type : ${types}">
                            <td style="font-weight: 600;" th:text="${type.leaveName}">Casual Leave</td>
                            <td th:text="${type.maxPerYear}">12</td>
                            <td>
                                <form th:action="@{/admin/leaves/types/delete/{id}(id=${type.leaveTypeId})}"
                                    method="post" onsubmit="return confirm('Are you sure?')">
                                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card" style="height: fit-content;">
                <h2 class="card-title"><i class="fas fa-plus-circle"></i> Add New Type</h2>
                <form th:action="@{/admin/leaves/types/save}" method="post" th:object="${newType}">
                    <div class="form-group">
                        <label>Leave Name</label>
                        <input type="text" th:field="*{leaveName}" placeholder="e.g. Sick Leave" required>
                    </div>
                    <div class="form-group">
                        <label>Maximum Days Per Year</label>
                        <input type="number" th:field="*{maxPerYear}" placeholder="e.g. 15" required min="1">
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Leave Type</button>
                </form>
            </div>
        </div>
        </div>
</body>

</html>
