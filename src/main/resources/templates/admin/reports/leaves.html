<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Leave Utilization Reports')}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-container">
        <header>
            <h1>Leave Utilization Reports</h1>
        </header>

        <div class="card">
            <form th:action="@{/admin/reports/leaves}" method="get" class="filter-form">
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" name="startDate" th:value="${startDate}">
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" name="endDate" th:value="${endDate}">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select name="departmentId">
                        <option value="">All Departments</option>
                        <option th:each="dept : ${departments}" th:value="${dept.departmentId}"
                            th:text="${dept.departmentName}" th:selected="${dept.departmentId == selectedDept}">IT
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn"><i class="fas fa-filter"></i> Filter</button>
            </form>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Employee ID</th>
                            <th>Employee Name</th>
                            <th>Department</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Duration (Days)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="report : ${reports}">
                            <td th:text="${report.empId}">EMP001</td>
                            <td th:text="${report.employeeName}">John Doe</td>
                            <td th:text="${report.departmentName}">IT</td>
                            <td th:text="${report.leaveTypeName}">Annual Leave</td>
                            <td th:text="${report.startDate}">2023-01-01</td>
                            <td th:text="${report.endDate}">2023-01-05</td>
                            <td th:text="${report.durationDays}">5</td>
                            <td>
                                <span th:text="${report.status}">Approved</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        </div>
</body>

</html>
