<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Apply Leave</title>
</head>
<body>

<h2>Apply Leave</h2>

<form th:action="@{/leaves/apply}" th:object="${leave}" method="post">

    Start Date:
    <input type="date" th:field="*{startDate}" required><br><br>

    End Date:
    <input type="date" th:field="*{endDate}" required><br><br>

    Reason:
    <input type="text" th:field="*{reason}" required><br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
