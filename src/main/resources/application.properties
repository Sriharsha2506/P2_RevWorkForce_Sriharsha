spring.application.name=P2_Rev_Workforce
server.port=8082

# H2 DB Configuration (File-based for persistence)
spring.datasource.url=jdbc:h2:file:./workforce_db_new;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=system
spring.datasource.password=2454
spring.datasource.driver-class-name=org.h2.Driver


# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Suppress open-in-view warning (keep true to avoid LazyInitializationException)
spring.jpa.open-in-view=true

# SQL Init — only run data.sql (skip schema.sql; Hibernate handles DDL via ddl-auto=update)
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
# JWT Configuration
